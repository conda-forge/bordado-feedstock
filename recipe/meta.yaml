{% set name = "bordado" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/bordado-{{ version }}.tar.gz
  sha256: b01e77947b3d2f57aff441b02e9f55172fbd364ce94a7bc92c107170a75a800d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - wheel
    - setuptools-scm >=8.0.3
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.23
    - scipy >=1.8

test:
  imports:
    - bordado
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Create, manipulate, and split geographic coordinates
  home: https://www.fatiando.org/bordado/
  dev_url: https://github.com/fatiando/bordado
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - leouieda
